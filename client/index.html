<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- DNS prefetch and preconnect for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Optimized font loading with display=swap -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Default meta tags for crawlers (overridden by React Helmet on each page) -->
    <title>Lawn Care Kuna | Professional Landscaping Services</title>
    <meta name="description" content="Professional lawn care and landscaping services in Kuna, Boise, Meridian, and Treasure Valley Idaho. Licensed, insured, top-rated since 2017. Free quotes today!" />
    
    <!-- Open Graph / Featured Image -->
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:image:alt" content="Lawn Care Kuna logo - Professional lawn care and landscaping services in Kuna Idaho" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/favicon.png" />
    <meta name="twitter:image:alt" content="Lawn Care Kuna logo - Professional lawn care and landscaping services in Kuna Idaho" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
