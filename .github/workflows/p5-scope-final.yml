name: P5 scope intake at all nine widths
on:
  push:
    branches: [codex/p5-scope-final-20260910]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      SESSION_SECRET: p5-visual-review-ephemeral-session-key-20260910
      TZ: UTC
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Build production application and preserve reviewed images
        run: |
          cp shared/blogImageRegistry.ts /tmp/p5-registry-before.ts
          npm run build
          cmp /tmp/p5-registry-before.ts shared/blogImageRegistry.ts
      - name: Exercise scope intake with isolated external services
        run: |
          npx next start -p 5000 > /tmp/p5-scope-server.log 2>&1 &
          node -e 'let n=0;const t=setInterval(async()=>{try{const r=await fetch("http://127.0.0.1:5000/estimate/scope");if(r.ok){clearInterval(t);return}}catch{}if(++n>90){clearInterval(t);process.exit(1)}},1000)'
          node scripts/p5-estimator-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-scope-final
          path: |
            p5-verification
            /tmp/p5-scope-server.log
          retention-days: 14
