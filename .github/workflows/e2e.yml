name: E2E

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened]
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DESIGN_STUDIO_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e -- --project="Desktop Chrome" --project="Pixel 7"
        env:
          CI: true
          E2E_SERVER_COMMAND: npx next start -p 3456
          SESSION_SECRET: e2e-test-session-secret-min-32-chars-long
