<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-label="Cabinet construction diagram">
  <rect width="800" height="480" fill="#F7F3EC"/>
  <!-- Plywood box -->
  <g>
    <rect x="60" y="120" width="200" height="240" fill="#FBFAF6" stroke="#5E564A" stroke-width="2.5" rx="3"/>
    <rect x="60" y="120" width="200" height="240" fill="none" stroke="#8C8170" stroke-width="1" stroke-dasharray="0" />
    <line x1="68" y1="128" x2="68" y2="352" stroke="#B7AD9B" stroke-width="1"/>
    <line x1="252" y1="128" x2="252" y2="352" stroke="#B7AD9B" stroke-width="1"/>
    <line x1="60" y1="240" x2="260" y2="240" stroke="#8C8170" stroke-width="1.2"/>
    <text x="160" y="392" text-anchor="middle" fill="#5E564A" font-family="system-ui,sans-serif" font-size="16">Plywood box</text>
  </g>
  <!-- Dovetail drawer -->
  <g>
    <rect x="320" y="160" width="180" height="120" fill="#FBFAF6" stroke="#5E564A" stroke-width="2.5" rx="3"/>
    <path d="M 320 160 l 18 0 l 6 12 l 18 0 l 6 -12 l 18 0 l 6 12 l 18 0 l 6 -12 l 18 0 l 6 12 l 18 0 l 6 -12 l 18 0" fill="none" stroke="#8C8170" stroke-width="1.4"/>
    <line x1="360" y1="220" x2="460" y2="220" stroke="#B7AD9B" stroke-width="2"/>
    <text x="410" y="312" text-anchor="middle" fill="#5E564A" font-family="system-ui,sans-serif" font-size="16">Dovetail drawers</text>
  </g>
  <!-- Soft-close hinge -->
  <g>
    <rect x="560" y="150" width="180" height="140" fill="#FBFAF6" stroke="#5E564A" stroke-width="2.5" rx="3"/>
    <path d="M 600 290 A 90 90 0 0 1 700 180" fill="none" stroke="#8C8170" stroke-width="2"/>
    <circle cx="600" cy="290" r="6" fill="#5E564A"/>
    <circle cx="700" cy="180" r="6" fill="#5E564A"/>
    <text x="650" y="322" text-anchor="middle" fill="#5E564A" font-family="system-ui,sans-serif" font-size="16">Soft-close hardware</text>
  </g>
  <text x="400" y="56" text-anchor="middle" fill="#5E564A" font-family="system-ui,sans-serif" font-size="24" font-weight="500">How our cabinets are built</text>
</svg>